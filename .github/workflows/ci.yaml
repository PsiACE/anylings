---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    # Deliberately no `labeled`/`unlabeled`: this workflow owns the code gate,
    # and a skipped job still reports success under the gate's own check name.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  contracts:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: safety contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check CI authorization and failure-safe cleanup
        run: bash tests/ci/check-safety.sh

      # The default stays ephemeral; a named claim is mounted by reference and
      # never rendered as an app-owned PVC. Uses the pinned chart, no cluster.
      - name: Check the magpie config-claim persistence contract
        run: bash tests/ci/check-magpie-config-claim.sh

      - name: Check k0s recovery without live kubeconfig
        run: bash tests/ci/check-k0s-reset.sh

      # The workflows themselves are a checked artifact: this asserts that the
      # gate stays offline and that the heavy rehearsal cannot report success by
      # being skipped. Offline, no runner and no GitHub API.
      - name: Check workflow gate wiring
        run: bash tests/ci/check-workflow-gate.sh

      # Renders the real pinned charts from an enabled configuration input, so
      # the optional slice is checked against artifacts rather than values-file
      # intent. Offline: no cluster, no credential, synthetic Secret name only.
      - name: Check the optional observability slice
        run: bash tests/ci/check-observability.sh

      # Same shape for the optional SpinKube slice: the pinned cert-manager and
      # Spin operator charts plus the vendored CRDs are rendered from an enabled
      # input, and the disabled input must publish nothing. Offline.
      - name: Check the optional SpinKube slice
        run: bash tests/ci/check-spinkube.sh

  # Rendering checks use no cloud credentials. The tunnel case supplies only
  # a synthetic file and verifies its encrypted Secret source with a repo prefix.
  render-platform:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: platform render (${{ matrix.config }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - base
          - cloudflare-tunnel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # `just init platform` supplies the isolated age identity, so fixtures stay
      # credential-free. Argo generates its initial admin Secret at runtime.
      - name: Prepare isolated inputs
        run: |
          umask 077
          inputs="$RUNNER_TEMP/anylings-inputs"
          mkdir -p "$inputs"
          export ANYLINGS_CONFIG="$inputs/cluster.toml"
          export SOPS_AGE_KEY_FILE="$inputs/age.key"
          cp "./tests/config/${{ matrix.config }}.toml" "$ANYLINGS_CONFIG"
          if [ "${{ matrix.config }}" = cloudflare-tunnel ]; then
            mkdir "$inputs/.local"
            printf 'synthetic-ci-tunnel-token\n' > "$inputs/.local/tunnel.token"
          fi
          echo "ANYLINGS_CONFIG=$ANYLINGS_CONFIG" >> "$GITHUB_ENV"
          echo "SOPS_AGE_KEY_FILE=$SOPS_AGE_KEY_FILE" >> "$GITHUB_ENV"
          just init platform

      - name: Run configure recipe
        run: just configure platform

      # The confidentiality, formatting and partial-encryption assertions live
      # in one script so tests/ci/local-gate.sh cannot drift from this job.
      - name: Run render assertions
        run: bash tests/ci/check-render.sh "${{ matrix.config }}"

      - name: Render the bootstrap manifests
        run: bash ./.local/rendered/bootstrap/bootstrap.sh render

      - name: Run reset recipe
        run: just --yes reset platform

  # The runtime image and its GitOps template are checked without a registry
  # push, cluster or cloud credential. The image itself is built and exercised
  # here, so the packaged toolchain is verified rather than assumed.
  agent-runtime:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: agent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # The release archive is fetched from the upstream GitHub release and
      # verified against its published digest inside the build. No credential
      # is involved: the T3 Code release and the PyPI project are public.
      - name: Build the runtime image
        run: |
          podman build \
            --platform linux/amd64 \
            --tag localhost/anylings/t3-code:ci \
            --file images/t3-code/Containerfile \
            images/t3-code

      # Static template checks plus the built image: both executables report
      # their pinned versions, the process is nonroot, and a fresh state root
      # is created and served. Nothing is pushed or deployed.
      - name: Check the runtime image and template
        run: bash tests/runtime/check-t3-code.sh --image localhost/anylings/t3-code:ci

  # Static checks for every OpenTofu root. No cloud credentials are involved:
  # init runs without a backend and validate only inspects the configuration.
  tofu-static:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: OpenTofu validation (${{ matrix.root }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root:
          - platform
          - k0s
          - doks
          - cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check formatting
        env:
          ROOT: ${{ matrix.root }}
        run: tofu -chdir="infra/tofu/${ROOT}" fmt -check -diff -recursive

      - name: Validate configuration
        env:
          ROOT: ${{ matrix.root }}
        run: |
          # Keep plugins and the local backend out of the work tree.
          export TF_DATA_DIR="$RUNNER_TEMP/tofu-${ROOT}"
          tofu -chdir="infra/tofu/${ROOT}" init -backend=false -input=false -no-color
          tofu -chdir="infra/tofu/${ROOT}" validate -no-color

      # Offline pool contracts for DOKS use a mocked provider only: no token,
      # no DigitalOcean API call and no state. Roots without test files pass.
      - name: Run offline contracts
        env:
          ROOT: ${{ matrix.root }}
        run: |
          export TF_DATA_DIR="$RUNNER_TEMP/tofu-${ROOT}"
          tofu -chdir="infra/tofu/${ROOT}" test -no-color

  # Landing review adapted from bubbuild/republic at 2fa76b5407ba1cf035293121bfab9e782ea199f3.
  landing-feedback:
    name: Landing review
    needs: [contracts, render-platform, tofu-static, agent-runtime]
    if: >-
      always() && !cancelled() && vars.LANDING_MODEL != '' &&
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
      - name: Review the candidate
        id: landing
        timeout-minutes: 20
        continue-on-error: true
        uses: bubbuild/landing@main # zizmor: ignore[unpinned-uses] -- intentionally track latest Landing
        env:
          GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_CLIENT_ARGS: ${{ vars.LANDING_CLIENT_ARGS || '{}' }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: "120"
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          command: review
          number: ${{ format('{0}', github.event.pull_request.number) }}
          head: ${{ github.event.pull_request.head.sha }}
          checked-revision: ${{ github.sha }}
          instruction: >-
            Native checks: contracts=${{ needs.contracts.result }}, platform-render=${{ needs.render-platform.result }},
            tofu-static=${{ needs.tofu-static.result }}, agent-runtime=${{ needs.agent-runtime.result }}.
            The native rehearsal is a separate workflow, started only when a maintainer adds the ci/native-rehearsal
            label, so do not ask for it or treat its absence as a missing check. When it was requested it uses
            disposable fixtures around
            the shared platform implementation: an owned k0s cluster, local-path storage, an upstream read-only Git
            daemon, the rendered bootstrap, and the OpenTofu bootstrap Application and ApplicationSet-generated
            children, then asserts Synced+Healthy at the pushed revision, a KSOPS-decrypted Secret, the magpie gateway
            answering and refusing unkeyed remote callers, Git-driven ApplicationSet deletion/recreation, PVC data
            restore and a repeat no-op. Its result, when present, is advisory evidence of runtime behavior, not proof of
            cloud, CSI or ingress behavior.
            Ignore the Landing review job when assessing native check completion.
            Review affected user-visible behavior against repository guidance. Reuse these check results and
            relevant review history; investigate unresolved questions and publish useful findings or a brief
            clean verdict.
      - name: Report unsuccessful feedback
        if: ${{ !cancelled() && steps.landing.outcome == 'failure' }}
        run: echo "::warning::Landing feedback failed. Inspect the task artifact; this review is advisory."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: landing-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 7
          if-no-files-found: warn
