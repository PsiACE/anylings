---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    # `labeled` lets a maintainer request the opt-in native rehearsal on an
    # existing pull request without pushing a commit or dispatching a run.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main

# A label event only selects the opt-in native rehearsal, so it keeps its own
# group per label name: labelling must never cancel the code run it is added to.
# Code events keep one group per pull request, so a new push still supersedes an
# older run of the same candidate.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
    format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Label changes only select the opt-in native rehearsal, so they must not
  # re-run the ordinary gate.
  contracts:
    if: >-
      github.repository == 'PsiACE/anylings' &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: safety contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check CI authorization and failure-safe cleanup
        run: bash tests/ci/check-safety.sh

      - name: Check k0s recovery without live kubeconfig
        run: bash tests/ci/check-k0s-reset.sh

  # Rendering checks use no cloud credentials. The tunnel case supplies only
  # a synthetic file and verifies its encrypted Secret source with a repo prefix.
  render-platform:
    if: >-
      github.repository == 'PsiACE/anylings' &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: platform render (${{ matrix.config }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - base
          - cloudflare-tunnel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # `just init platform` supplies the isolated age identity, so fixtures stay
      # credential-free. Argo generates its initial admin Secret at runtime.
      - name: Prepare isolated inputs
        run: |
          umask 077
          inputs="$RUNNER_TEMP/anylings-inputs"
          mkdir -p "$inputs"
          export ANYLINGS_CONFIG="$inputs/cluster.toml"
          export SOPS_AGE_KEY_FILE="$inputs/age.key"
          cp "./tests/config/${{ matrix.config }}.toml" "$ANYLINGS_CONFIG"
          if [ "${{ matrix.config }}" = cloudflare-tunnel ]; then
            mkdir "$inputs/.local"
            printf 'synthetic-ci-tunnel-token\n' > "$inputs/.local/tunnel.token"
          fi
          echo "ANYLINGS_CONFIG=$ANYLINGS_CONFIG" >> "$GITHUB_ENV"
          echo "SOPS_AGE_KEY_FILE=$SOPS_AGE_KEY_FILE" >> "$GITHUB_ENV"
          just init platform

      - name: Run configure recipe
        run: just configure platform

      - name: Check tunnel credential delivery from the published Git source
        if: matrix.config == 'cloudflare-tunnel'
        run: |
          # The Git-file generator passes manifestPath to the Application's
          # Git source; exercise that published KSOPS path without exposing it.
          source=$(jq -r '.manifestPath' .local/rendered/kubernetes/apps/network/cloudflare-tunnel/config.json)
          case "$source" in
            clusters/tunnel/*) source="${source#clusters/tunnel/}" ;;
            *) echo "::error::tunnel Secret source is outside the configured Git prefix" >&2; exit 1 ;;
          esac
          kustomize build --enable-alpha-plugins --enable-exec ".local/rendered/$source" \
            | yq -e 'select(.kind == "Secret" and .stringData.TUNNEL_TOKEN != null) | .stringData.TUNNEL_TOKEN == "synthetic-ci-tunnel-token"' >/dev/null
          if grep -rqF 'synthetic-ci-tunnel-token' .local/rendered/kubernetes; then
            echo "::error::synthetic tunnel token remains in plaintext"
            exit 1
          fi

      # Rendered output must already match the format-yaml pre-commit hook,
      # otherwise every `just configure platform` shows up as formatting churn. Only
      # tracked-file types are checked: rendered plaintext is never inspected.
      - name: Assert rendered output is formatted
        run: oxfmt --check ./.local/rendered/.sops.yaml ./.local/rendered/kubernetes

      - name: Render the bootstrap manifests
        run: bash ./.local/rendered/bootstrap/bootstrap.sh render

      # A single confidentiality contract, through the public output check.
      # filestatus still says encrypted after a plaintext Helm value is added.
      - name: Reject partially encrypted publication output
        if: matrix.config == 'base'
        run: |
          values="$(find .local/rendered/kubernetes/apps -name 'values.sops.yaml' -print -quit)"
          test -n "$values"
          cp "$values" "$RUNNER_TEMP/encrypted-values.yaml"
          trap 'mv "$RUNNER_TEMP/encrypted-values.yaml" "$values"' EXIT
          yq -i '.publicationCheck = "synthetic-unencrypted"' "$values"
          sops filestatus "$values" | jq -e '.encrypted == true' >/dev/null
          if just check platform; then
            echo "::error::accepted partially encrypted publication output"
            exit 1
          fi
          mv "$RUNNER_TEMP/encrypted-values.yaml" "$values"
          trap - EXIT
          just check platform

      - name: Run reset recipe
        run: just --yes reset platform

  # Static checks for every OpenTofu root. No cloud credentials are involved:
  # init runs without a backend and validate only inspects the configuration.
  tofu-static:
    if: >-
      github.repository == 'PsiACE/anylings' &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
    name: OpenTofu validation (${{ matrix.root }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root:
          - platform
          - k0s
          - doks
          - cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check formatting
        env:
          ROOT: ${{ matrix.root }}
        run: tofu -chdir="infra/tofu/${ROOT}" fmt -check -diff -recursive

      - name: Validate configuration
        env:
          ROOT: ${{ matrix.root }}
        run: |
          # Keep plugins and the local backend out of the work tree.
          export TF_DATA_DIR="$RUNNER_TEMP/tofu-${ROOT}"
          tofu -chdir="infra/tofu/${ROOT}" init -backend=false -input=false -no-color
          tofu -chdir="infra/tofu/${ROOT}" validate -no-color

      # Offline pool contracts for DOKS use a mocked provider only: no token,
      # no DigitalOcean API call and no state. Roots without test files pass.
      - name: Run offline contracts
        env:
          ROOT: ${{ matrix.root }}
        run: |
          export TF_DATA_DIR="$RUNNER_TEMP/tofu-${ROOT}"
          tofu -chdir="infra/tofu/${ROOT}" test -no-color

  # The native integration suite needs a disposable runner, root for k0s and
  # most of the workflow's wall time, so it is not part of the per-pull-request
  # gate. A maintainer opts a candidate in by adding the `ci/native-rehearsal`
  # label; ordinary reviews stay fast and the label event re-runs nothing else.
  #
  # Fixtures still require explicit CI authorization from the runner itself
  # (tests/ci/run.sh), not from this condition: the job selector only decides
  # whether the evidence is collected. No cloud credentials and no pre-existing
  # Kubernetes Secret is involved.
  #
  # It deliberately declares no `needs`. A label event skips the gate jobs, so a
  # dependency on them would make the opt-in label select nothing.
  native-e2e:
    if: >-
      github.repository == 'PsiACE/anylings' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ci/native-rehearsal')
    name: native-rehearsal (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # k0s needs root for containerd, kubelet and CNI. The runner is
      # disposable, and the rehearsal only ever owns the resources it creates.
      - name: Prepare native prerequisites
        run: |
          # Only host tools the rehearsal shells out to that mise does not
          # provide. jq, kubectl, helm, sops, yq, tofu and k0sctl come from the
          # locked tool set; the OpenTofu k0s root invokes k0sctl internally.
          need="curl git python3 sha256sum systemctl"
          for tool in $need; do
            command -v "$tool" >/dev/null || { echo "::error::missing $tool"; exit 1; }
          done
          test -x "$(git --exec-path)/git-daemon" || { echo "::error::Git daemon is required"; exit 1; }
          sudo -n true || { echo "::error::native rehearsal needs passwordless sudo for k0s"; exit 1; }

      - name: Run native rehearsal
        env:
          ANYLINGS_CI_DISPOSABLE: "1"
        run: bash tests/ci/run.sh

      # Diagnostics are optional evidence, so a transport failure must not
      # decide the check: the rehearsal step above already fails on a real test
      # failure. Without this, an artifact-API error paints a green rehearsal
      # red and hides the actual result.
      - name: Upload sanitized diagnostics
        id: diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anylings-ci.*/diag/
          retention-days: 30
          if-no-files-found: ignore

      - name: Report unavailable diagnostics
        if: ${{ !cancelled() && steps.diagnostics.outcome == 'failure' }}
        run: echo "::warning::Diagnostics upload failed; the rehearsal result above stands."

  # Landing review adapted from bubbuild/republic at 2fa76b5407ba1cf035293121bfab9e782ea199f3.
  landing-feedback:
    name: Landing review
    # Advisory review of the ordinary gate only. The opt-in native rehearsal is
    # separate evidence and must not delay or block review on a candidate that
    # never requested it.
    needs: [contracts, render-platform, tofu-static]
    if: >-
      always() && !cancelled() && vars.LANDING_MODEL != '' &&
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
      - name: Review the candidate
        id: landing
        timeout-minutes: 20
        continue-on-error: true
        uses: bubbuild/landing@main # zizmor: ignore[unpinned-uses] -- intentionally track latest Landing
        env:
          GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_CLIENT_ARGS: ${{ vars.LANDING_CLIENT_ARGS || '{}' }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: "120"
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          command: review
          number: ${{ format('{0}', github.event.pull_request.number) }}
          head: ${{ github.event.pull_request.head.sha }}
          checked-revision: ${{ github.sha }}
          instruction: >-
            Native checks: contracts=${{ needs.contracts.result }}, platform-render=${{ needs.render-platform.result }},
            tofu-static=${{ needs.tofu-static.result }}.
            The native rehearsal is opt-in through the ci/native-rehearsal label and is not part of this gate, so do not
            ask for it or treat its absence as a missing check. When it was requested it uses disposable fixtures around
            the shared platform implementation: an owned k0s cluster, local-path storage, an upstream read-only Git
            daemon, the rendered bootstrap, and the OpenTofu bootstrap Application and ApplicationSet-generated
            children, then asserts Synced+Healthy at the pushed revision, a KSOPS-decrypted Secret, the magpie gateway
            answering and refusing unkeyed remote callers, Git-driven ApplicationSet deletion/recreation, PVC data
            restore and a repeat no-op. Its result, when present, is advisory evidence of runtime behavior, not proof of
            cloud, CSI or ingress behavior.
            Ignore the Landing review job when assessing native check completion.
            Review affected user-visible behavior against repository guidance. Reuse these check results and
            relevant review history; investigate unresolved questions and publish useful findings or a brief
            clean verdict.
      - name: Report unsuccessful feedback
        if: ${{ !cancelled() && steps.landing.outcome == 'failure' }}
        run: echo "::warning::Landing feedback failed. Inspect the task artifact; native checks determine acceptance."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: landing-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
