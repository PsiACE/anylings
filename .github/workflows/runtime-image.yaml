---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "runtime image"

# Publishes the agent runtime image to the registry this repository names, after
# a normal merge to main. It is the only place that may write a package, and it
# is deliberately not part of the pull-request gate.
#
# Why its own workflow rather than a job in ci.yaml: no pull-request event can
# start it, a fork cannot reach it, and a skipped publish job can never report
# success under a gate check name. The gate therefore keeps describing exactly
# the checks it ran.
on:
  push:
    branches:
      - main

# One publish per commit. A newer push supersedes an older one rather than
# racing it.
concurrency:
  group: runtime-image-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    # Trust guard, stated as data: only the canonical repository, only a push,
    # only its default branch. A fork cannot satisfy the repository check.
    if: >-
      github.repository == 'PsiACE/anylings' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    name: publish t3-code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Writes only this image's package. `contents: read` is what the checkout
      # needs; nothing here can push commits or change workflows.
      contents: read
      packages: write # Only this image's package, in this repository's own registry.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          experimental: true
          install_args: --locked
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # The registry path is derived from the repository rather than configured
      # here, so a fork or a rename publishes under its own namespace instead of
      # this project's, and no owner is written into the workflow.
      - name: Derive the image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Lowercase, because a registry reference must be while a GitHub owner
          # may not be.
          image="ghcr.io/${REPOSITORY,,}/t3-code"
          # The release tag the Containerfile already carries, read from it so
          # this workflow does not become a second place to pin T3 Code.
          version_tag="$(sed -nE 's/^ARG T3_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' images/t3-code/Containerfile)"
          test -n "$version_tag"
          {
            echo "repository=$image"
            echo "source_tag=sha-${SHA}"
            echo "version_tag=$version_tag"
          } >>"$GITHUB_OUTPUT"
          printf 'publishing %s:%s (T3 Code %s)\n' "$image" "sha-${SHA}" "$version_tag"

      - name: Build the runtime image
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_TAG: ${{ steps.image.outputs.source_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
        run: |
          set -euo pipefail
          podman build \
            --platform linux/amd64 \
            --tag "${REPOSITORY}:${SOURCE_TAG}" \
            --tag "${REPOSITORY}:${VERSION_TAG}" \
            --file images/t3-code/Containerfile \
            images/t3-code

      # The same checker the gate runs, against the image about to be published,
      # so a broken build cannot become a published tag. It needs no network
      # beyond what the build already used.
      - name: Check the image before publishing
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_TAG: ${{ steps.image.outputs.source_tag }}
        run: bash tests/runtime/check-t3-code.sh --image "${REPOSITORY}:${SOURCE_TAG}"

      # Ephemeral token only: it lives in this step's environment, is piped to
      # the login command, and is never written to a file or exported further.
      - name: Publish to the repository registry
        id: push
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_TAG: ${{ steps.image.outputs.source_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          umask 077
          digest_file="$RUNNER_TEMP/source.digest"
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io --username "$ACTOR" --password-stdin
          # --digestfile records what the registry stored, which is not
          # necessarily the local image's digest: a push may re-compress layers.
          podman push --digestfile "$digest_file" "${REPOSITORY}:${SOURCE_TAG}"
          podman push "${REPOSITORY}:${VERSION_TAG}"
          podman logout ghcr.io
          digest="$(cat "$digest_file")"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::the registry returned no digest: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      # Record what was published, digest included, so a deployment pins a value
      # that exists rather than one guessed from a tag.
      - name: Record the published digest
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_TAG: ${{ steps.image.outputs.source_tag }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Published runtime image"
            echo
            echo '| field | value |'
            echo '| --- | --- |'
            echo "| source | \`${REPOSITORY}:${SOURCE_TAG}\` |"
            echo "| version tag | \`${REPOSITORY}:${VERSION_TAG}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo
            echo 'Pin `[agents] image_digest` to the digest above to deploy exactly this build.'
            echo
            echo 'The package is created private by default. Anonymous pulls are'
            echo 'not proven to work until a maintainer makes the package public in'
            echo 'its registry settings; a cluster needs an image pull secret until then.'
          } | tee "$GITHUB_STEP_SUMMARY"
