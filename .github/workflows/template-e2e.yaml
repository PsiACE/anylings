---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "E2E"

on:
  workflow_dispatch:
    inputs:
      number:
        description: Candidate PR number (zero for branch maintenance)
        type: string
        default: "0"
      head:
        description: Full candidate head SHA
        type: string
        default: ""
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.repository_id }}-${{ github.event.pull_request.number || (inputs.number != '' && inputs.number != '0' && inputs.number) || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-invalid:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: reject-invalid (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - overlapping-cidrs
          - nested-cidr-overlap
          - non-canonical-cidr
          - tiny-svc-cidr
          - duplicate-gateway-addrs
          - duplicate-node-names
          - reserved-node-name
          - bad-mac-address
          - bad-repo-url
          - missing-known-hosts
          - node-addr-outside-cidr
          - node-uses-gateway-addr
          - gateway-node-collision
          - bad-vlan-tag
          - bad-bgp-asn
          - missing-dns-token
          - tunnel-without-dns
          - missing-external-gateway
          - missing-schematic
          - partial-bgp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Assert schema rejects ${{ matrix.fixture }}.toml
        run: |
          fixture=./.github/template-tests/invalid/${{ matrix.fixture }}.toml
          if uv run --quiet --locked --no-dev ./template/scripts/validate.py "$fixture" >/dev/null 2>&1; then
            echo "::error::schema accepted invalid fixture ${{ matrix.fixture }} (expected rejection)"
            exit 1
          fi
          echo "schema correctly rejected ${{ matrix.fixture }}"
          # Also surface the actual error message in the log for debuggability.
          uv run --quiet --locked --no-dev ./template/scripts/validate.py "$fixture" || true

  validator-tests:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: validator-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Run validator tests
        run: uv run --quiet --locked pytest ./template/scripts/test_validate.py

  validate-valid:
    if: ${{ github.repository == 'PsiACE/anylings' }}
    name: accept-valid (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - public
          - private
          - selfhosted
          - no-webhook
          - internal
          - direct
          - single-node
          - multi-controller
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install_args: --locked

      - name: Run init recipe
        run: just init

      - name: Prepare files
        run: |
          cp ./.github/template-tests/valid/${{ matrix.fixture }}.toml cluster.toml
          echo '{"AccountTag":"fake","TunnelSecret":"fake","TunnelID":"fake"}' > cloudflare-tunnel.json
          touch kubeconfig

      - name: Assert cluster.toml passes the JSON Schema
        run: taplo check --schema "file://$PWD/cluster.schema.json" ./cluster.toml

      - name: Run configure recipe
        run: just configure

      # Rendered output must already match the format-yaml pre-commit hook,
      # otherwise every `just configure` shows up as formatting churn.
      - name: Assert rendered output is formatted
        run: oxfmt --check ./.sops.yaml ./bootstrap ./kubernetes ./talos

      - name: Install flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""

      - name: Run flate test
        run: flate test all -p ./kubernetes/argo/cluster

      - name: Render bootstrap helmfile charts
        run: just template test-helmfile

      - name: Dry run bootstrap talos recipe
        run: just --dry-run bootstrap talos

      - name: Create talos secret
        run: just bootstrap talos-secret

      - name: Render talos configs
        run: just talos render

      - name: Validate talos configs
        run: |
          for config in ./talos/rendered/*.yaml; do
            talosctl validate --config "$config" --mode metal
          done

      - name: Dry run bootstrap apps recipe
        run: just --dry-run bootstrap apps

      - name: Run reset recipe
        run: yes | just template reset

      - name: Run tidy recipe
        run: yes | just template tidy

  # Landing review adapted from bubbuild/republic at 2fa76b5407ba1cf035293121bfab9e782ea199f3.
  landing-feedback:
    name: Landing review
    needs: [validate-invalid, validator-tests, validate-valid]
    if: >-
      always() && !cancelled() && vars.LANDING_MODEL != '' &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.number != '' && inputs.number != '0'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install_args: --locked
      - name: Review the candidate
        id: landing
        timeout-minutes: 20
        continue-on-error: true
        uses: bubbuild/landing@main # zizmor: ignore[unpinned-uses] -- intentionally track latest Landing
        env:
          GH_ADMISSION_TOKEN: ${{ secrets.LANDING_ADMISSION_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
          LANDING_MODEL: ${{ vars.LANDING_MODEL }}
          LANDING_API_KEY: ${{ secrets.LANDING_API_KEY }}
          LANDING_API_BASE: ${{ vars.LANDING_API_BASE }}
          LANDING_CLIENT_ARGS: ${{ vars.LANDING_CLIENT_ARGS || '{}' }}
          LANDING_COMPLETION_ARGS: ${{ vars.LANDING_COMPLETION_ARGS || '{}' }}
          LANDING_MODEL_TIMEOUT_SECONDS: "120"
        with:
          trust: ${{ vars.LANDING_TRUST || 'repository' }}
          command: review
          number: ${{ format('{0}', github.event.pull_request.number || inputs.number || 0) }}
          head: ${{ github.event.pull_request.head.sha || inputs.head || '' }}
          checked-revision: ${{ github.sha }}
          instruction: >-
            Native checks: reject-invalid=${{ needs.validate-invalid.result }}, validator-tests=${{ needs.validator-tests.result }}, accept-valid=${{ needs.validate-valid.result }}.
            Ignore the Landing review job when assessing native check completion.
            Review affected user-visible behavior against repository guidance. Reuse these check results and relevant review history; investigate unresolved questions and publish useful findings or a brief clean verdict.
      - name: Report unsuccessful feedback
        if: ${{ !cancelled() && steps.landing.outcome == 'failure' }}
        run: echo "::warning::Landing feedback failed. Inspect the task artifact; native checks determine acceptance."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: landing-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/landing/
          retention-days: 30
          if-no-files-found: warn
