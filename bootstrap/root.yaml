apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anylings
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PsiACE/anylings.git
    targetRevision: main
    path: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
