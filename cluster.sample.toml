#:schema ./cluster.schema.json
# =============================================================================
#    The Git repository Argo CD syncs from. This is the single source of
#    truth for everything in the cluster — once bootstrapped, changes are
#    made by pushing to this repo.
# =============================================================================
[repository]

# Full clone URL of the repository this cluster pulls from.
# Use https:// for a publicly readable repo (http:// or git:// only on an isolated LAN),
# or ssh://git@ for a private one; the template then wires up a deploy key.
# REQUIRED. Examples:
#   "https://github.com/PsiACE/anylings.git"
#   "ssh://git@github.com/PsiACE/anylings.git"
url = "https://github.com/PsiACE/anylings.git"

# Branch Argo watches.
# OPTIONAL. Default: "main"
branch = "main"

# Optional directory prefix inside the repository, for a cluster definition
# that lives in a subdirectory of a monorepo. Every rendered source path is
# resolved through it. Must be relative and must not contain "." or "..".
# OPTIONAL. Default: "" (repository root)
# Example: "clusters/production"
path = ""

# SSH host keys for your Git host (`ssh-keyscan -t ed25519,ecdsa,rsa <host>`).
# Only used with ssh:// URLs. github.com, gitlab.com and codeberg.org are
# bundled; REQUIRED for any other host.
# OPTIONAL.
known_hosts = ""


# =============================================================================
#    Argo CD. The chart version here is the only place the version is set:
#    bootstrap.sh and the self-managed Application both read it, so the
#    first install and steady state cannot drift.
# =============================================================================
[argocd]

# OPTIONAL. Default: "10.14.0"
chart_version = "10.14.0"

# OPTIONAL. Default: "argo-system"
namespace = "argo-system"


# =============================================================================
#    How traffic reaches the cluster. "none" keeps the cluster fully
#    credential-free (CI default). "cloudflare-tunnel" runs cloudflared
#    outbound-only; DNS records and routes are owned by the OpenTofu cloudflare
#    root, not rendered here.
# =============================================================================
[ingress]

# OPTIONAL. Default: "none". Allowed: "none" | "cloudflare-tunnel"
mode = "none"

# Path to the Cloudflare tunnel token, resolved relative to this file.
# REQUIRED when mode is "cloudflare-tunnel"; must be empty otherwise.
# The token is a file input, never a plaintext value in this file.
# OPTIONAL. Example: ".local/cloudflare-tunnel.token"
tunnel_token_file = ""


# =============================================================================
#    Optional self-hosted observability. Disabled by default; enabling it
#    publishes two ClusterIP-only applications into the `observability`
#    namespace: single-node VictoriaMetrics (7d retention target) and Gatus
#    (probe status and alerting). No Grafana, Loki, operator or database is
#    deployed, and no PersistentVolumeClaim is provisioned automatically.
# =============================================================================
[observability]

# OPTIONAL. Default: false
# enabled = true
enabled = false
