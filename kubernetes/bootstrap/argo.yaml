---
apiVersion: argoproj.io/v1alpha1
kind: Application
# No deletion finalizer on Argo itself, matching Autopilot. Normal sync prunes.
metadata:
  name: argo
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    argocd.argoproj.io/instance: argo
spec:
  project: default
  sources:
    - repoURL: https://github.com/PsiACE/anylings.git
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/argoproj/argo-helm
      chart: argo-cd
      # Same value bootstrap.sh installs with.
      targetRevision: 10.14.0
      helm:
        releaseName: argo-cd
        valueFiles:
          - $repo/kubernetes/apps/argo-system/argo-cd/values.yaml
  destination:
    name: in-cluster
    namespace: argo-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    retry:
      limit: 1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # Argo CRDs exceed the client-side last-applied annotation limit.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
