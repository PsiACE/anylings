[makejinja]
inputs = ["./template/config"]
# Isolated by default; `just template render` passes ANYLINGS_OUTPUT_DIR
# explicitly, and no generated file is written to the repository root.
output = "./.local/rendered"
import_paths = ["./template/scripts"]
loaders = ["plugin:Plugin"]
jinja_suffix = ".j2"
# Copying metadata would impose the template's modes on rendered files and
# undo the render recipe's umask; generated secrets must stay 0600/0700.
copy_metadata = false
force = true
undefined = "strict"

[makejinja.delimiter]
block_start = "#%"
block_end = "%#"
comment_start = "#|"
comment_end = "#|"
variable_start = "#{"
variable_end = "}#"
