apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/PsiACE/anylings.git
        revision: main
        files:
          - path: apps/*.yaml
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ trimSuffix ".yaml" .path.filename }}'
    spec:
      project: default
      sources:
        - repoURL: ghcr.io/bjw-s-labs/helm
          chart: app-template
          targetRevision: 5.3.0
          helm:
            valueFiles:
              - '$values/apps/{{ .path.filename }}'
        - repoURL: https://github.com/PsiACE/anylings.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ trimSuffix ".yaml" .path.filename }}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
