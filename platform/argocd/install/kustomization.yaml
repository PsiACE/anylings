apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Argo CD v3.6.3
  - https://raw.githubusercontent.com/argoproj/argo-cd/b4accc482028fd529b3e4508ef9f28977b552b50/manifests/install.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                args:
                  - /usr/local/bin/argocd-server
                  - --insecure
                  - --rootpath=/argocd
                  - --basehref=/argocd
