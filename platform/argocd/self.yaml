apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/PsiACE/anylings.git
      targetRevision: main
      path: platform/argocd/chart
      helm:
        releaseName: argocd
    - repoURL: https://github.com/PsiACE/anylings.git
      targetRevision: main
      path: platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
