apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
  annotations:
    # Wait for the ESO deployments and the store admission webhook.
    argocd.argoproj.io/sync-wave: "1"
    # The store reports Ready=False until the bootstrap token is installed.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  provider:
    onepasswordSDK:
      vault: anylings
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          key: token
          namespace: external-secrets
      cache:
        ttl: 5m
        maxSize: 100
