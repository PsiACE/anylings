[project]
name = "anylings"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ansible-core==2.20.7",
    "duty==1.10.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "myst-parser>=4.0.1",
    "numpydoc>=1.9.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]

[project.urls]
Documentation = "https://anylings.com/"
Repository = "https://github.com/PsiACE/anylings"
