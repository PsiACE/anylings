# Archived pre-fix collector configuration for the operational-log regression control.
#
# Copied verbatim from the rendered ConfigMap at commit
# ae6a8bfc544b94aeb828d86c225bc3bed49ca2ef ("feat(observability): ingest
# operational logs and Events"). It is checked in rather than read from git at
# test time so a clean CI checkout needs no historical objects, no network and
# no particular clone depth.
#
# Why this baseline and not a later one: it predates the type guards, the
# envelope purge, the nil-free body AND both duplicate-key normalisations, so
# it is a genuine old negative for every guard the fixture asserts. A later
# commit already fixes some of them, which would make the corresponding
# control assertion pass for the wrong reason.
#
# Regenerate only by rendering the chart at that commit:
#   helm template otel-events \
#     oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector \
#     --version 0.140.0 --namespace observability --values <values at ae6a8bfc> \
#     | yq -r 'select(.kind=="ConfigMap") | .data.relay'
#
# This file contains no credential, host path or real endpoint: the chart's
# own loopback-free cluster addresses are replaced by the fixture at run time.
# The pre-commit form of this body was byte-identical to that render
# (sha256 06802a587c90346adca5cbb21d5d72278b9b9e2a4018189add9bc70ddd0af001).
# The repository's YAML formatter then normalised its layout without changing
# any value; the checked-in form is verified semantically equal to the archived
# render by comparing parsed documents, which is the property that matters here.
# Regenerate by rendering the chart at that commit, as below.
exporters:
  otlphttp/victoria-logs:
    logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_elapsed_time: 30s
      max_interval: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 128
    timeout: 5s
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
processors:
  filter/events_allowlist:
    error_mode: ignore
    logs:
      log_record:
        - attributes["event_type"] == nil or not IsMatch(attributes["event_type"], "^(ADDED|MODIFIED|DELETED)$")
        - attributes["event_severity"] == nil or not IsMatch(attributes["event_severity"],
          "^(Normal|Warning)$")
        - attributes["event_reason"] == nil or not IsMatch(attributes["event_reason"],
          "^[A-Za-z][A-Za-z0-9]{0,63}$")
        - attributes["object_kind"] == nil or not IsMatch(attributes["object_kind"],
          "^[A-Z][A-Za-z0-9]{0,63}$")
        - attributes["object_name"] == nil or not IsMatch(attributes["object_name"],
          "^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$")
        - attributes["event_namespace"] == nil or not IsMatch(attributes["event_namespace"],
          "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])$")
        - attributes["event_count"] < 0 or attributes["event_count"] > 100000
  filter/otlp_allowlist:
    error_mode: ignore
    logs:
      log_record:
        - attributes["reason"] == nil or not IsMatch(attributes["reason"], "^[A-Za-z][A-Za-z0-9]{0,63}$")
        - attributes["level"] == nil or not IsMatch(attributes["level"], "^(DEBUG|INFO|WARN|ERROR)$")
        - attributes["component"] != nil and not IsMatch(attributes["component"], "^[a-z0-9]([-a-z0-9]{0,62}[a-z0-9])?$")
        - attributes["event_count"] < 0 or attributes["event_count"] > 100000
        - resource.attributes["service.name"] != nil and not IsMatch(resource.attributes["service.name"],
          "^[a-z0-9]([-a-z0-9]{0,62}[a-z0-9])?$")
        - resource.attributes["k8s.namespace.name"] != nil and not IsMatch(resource.attributes["k8s.namespace.name"],
          "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])$")
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50
  transform/events_extract:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["k8s.namespace.name"])
      - context: log
        statements:
          - set(attributes["event_type"], body["type"])
          - set(attributes["event_severity"], body["object"]["type"])
          - set(attributes["event_reason"], body["object"]["reason"])
          - set(attributes["event_count"], body["object"]["count"])
          - set(attributes["event_count"], body["object"]["series"]["count"]) where attributes["event_count"]
            == nil
          - set(attributes["event_count"], 1) where attributes["event_count"] == nil
          - set(attributes["object_kind"], body["object"]["involvedObject"]["kind"])
          - set(attributes["object_kind"], body["object"]["regarding"]["kind"]) where
            attributes["object_kind"] == nil
          - set(attributes["object_name"], body["object"]["involvedObject"]["name"])
          - set(attributes["object_name"], body["object"]["regarding"]["name"]) where
            attributes["object_name"] == nil
          - set(attributes["event_namespace"], body["object"]["involvedObject"]["namespace"])
          - set(attributes["event_namespace"], body["object"]["regarding"]["namespace"])
            where attributes["event_namespace"] == nil
          - set(attributes["event_namespace"], body["object"]["metadata"]["namespace"])
            where attributes["event_namespace"] == nil
  transform/events_shape:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.body, Concat(["event", attributes["event_type"], attributes["object_kind"],
            attributes["event_namespace"], attributes["object_name"], attributes["event_reason"]],
            " "))
          - set(log.severity_text, "WARN") where attributes["event_severity"] == "Warning"
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where attributes["event_severity"]
            == "Warning"
          - set(log.severity_text, "INFO") where attributes["event_severity"] == "Normal"
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where attributes["event_severity"]
            == "Normal"
          - keep_keys(attributes, ["event_type", "event_severity", "event_reason", "event_count",
            "object_kind", "object_name", "event_namespace"])
  transform/otlp_extract:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["k8s.namespace.name", "service.name"])
      - context: log
        statements:
          - set(attributes["event_count"], 1) where attributes["event_count"] == nil
  transform/otlp_shape:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.body, Concat(["event", attributes["level"], attributes["component"],
            resource.attributes["k8s.namespace.name"], attributes["reason"]], " "))
          - set(log.severity_text, "ERROR") where attributes["level"] == "ERROR"
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where attributes["level"]
            == "ERROR"
          - set(log.severity_text, "WARN") where attributes["level"] == "WARN"
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where attributes["level"] ==
            "WARN"
          - set(log.severity_text, "INFO") where attributes["level"] == "INFO"
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where attributes["level"] ==
            "INFO"
          - set(log.severity_text, "DEBUG") where attributes["level"] == "DEBUG"
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where attributes["level"]
            == "DEBUG"
          - keep_keys(attributes, ["event_count", "reason", "level", "component"])
receivers:
  k8sobjects:
    auth_type: serviceAccount
    error_mode: propagate
    include_initial_state: false
    objects:
      - mode: watch
        name: events
  otlp:
    protocols:
      http:
        endpoint: ${env:MY_POD_IP}:4318
service:
  extensions:
    - health_check
  pipelines:
    logs/events:
      exporters:
        - otlphttp/victoria-logs
      processors:
        - memory_limiter
        - transform/events_extract
        - filter/events_allowlist
        - transform/events_shape
      receivers:
        - k8sobjects
    logs/structured:
      exporters:
        - otlphttp/victoria-logs
      processors:
        - memory_limiter
        - transform/otlp_extract
        - filter/otlp_allowlist
        - transform/otlp_shape
      receivers:
        - otlp
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:MY_POD_IP}
                port: 8888
