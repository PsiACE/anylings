# Synthetic inputs for the agent runtime: a registry and claim name that exist
# only in this fixture. The values are public identifiers, never credentials.
[repository]
url = "git://git.example.test/platform.git"

# The Cloudflare Tunnel connector is part of the baseline, so every input names
# its token file. CI writes a synthetic token beside this input before
# rendering; the file is never a real credential.
[ingress]
tunnel_token_file = ".local/tunnel.token"

[agents]
image_repository = "registry.example.test/anylings/bub"
image_tag = "bub0.6.1-t3web0.1.8"
storage_existing_claim = "bub-home"
