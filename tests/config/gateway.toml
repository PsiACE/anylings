[repository]
url = "git://git.example.test/platform.git"

# The opt-in shared gateway: the render seeds Magpie's own two stores and wires
# the agent runtime to it. Both files hold synthetic values that exist only in
# this fixture; CI writes them beside this config before rendering.
[magpie]
seed_dir = "secret-inputs"

[agents]
image_repository = "registry.example.test/anylings/bub"
image_tag = "bub0.6.1-t3web0.1.8"
storage_existing_claim = "bub-home"
gateway_secret = "secret-inputs/magpie-gateway-key"
