# Fixture gateway writer: the production shape, reduced to a synthetic dataset.
#
# One claim, one Deployment, uid/gid 65532 to match the images and the data
# ownership the production writers have. It writes a deterministic record set
# once, then a heartbeat every second so a quiesced volume is distinguishable
# from a live one by content and not only by replica count.
#
# Synthetic data only: no tenant content, no credential, no real record.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer-gateway
  namespace: blueprint-source
  labels:
    anylings.dev/owner: blueprint-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      anylings.dev/owner: blueprint-fixture
      app.kubernetes.io/name: writer-gateway
  template:
    metadata:
      labels:
        anylings.dev/owner: blueprint-fixture
        app.kubernetes.io/name: writer-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /data/records /data/state
              if [ ! -f /data/records/records.ndjson ]; then
                i=0
                while [ "$i" -lt 200 ]; do
                  printf '{"seq":%s,"dataset":"gateway","value":"synthetic-%s"}\n' "$i" "$i"
                  i=$((i + 1))
                done > /data/records/records.ndjson
                printf 'gateway\n' > /data/state/owner
              fi
              printf 'writer-gateway-start\n' >> /data/state/writer.log
              while :; do
                date +%s.%N >> /data/state/heartbeat
                sleep 1
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: magpie-config
